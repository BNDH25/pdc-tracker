<!doctype html>
<html lang="fr" data-theme="dark" style="color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>PDC Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDC">
<!-- SÉCURITÉ : l'app ne charge que ses propres fichiers, dans son dossier https://bndh25.github.io/pdc-tracker/ ;
     rien d'un autre projet publié sur bndh25.github.io, aucun script écrit dans la page, aucun site extérieur.
     Si l'adresse de publication change, mettre à jour cette ligne (sinon l'app ne se charge plus). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://bndh25.github.io/pdc-tracker/js/; style-src https://bndh25.github.io/pdc-tracker/css/ 'unsafe-inline'; font-src https://bndh25.github.io/pdc-tracker/fonts/; img-src https://bndh25.github.io/pdc-tracker/; connect-src https://bndh25.github.io/pdc-tracker/; manifest-src https://bndh25.github.io/pdc-tracker/manifest.webmanifest; worker-src https://bndh25.github.io/pdc-tracker/sw.js; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="css/style.css">
<!-- Reste dans la page : le dégradé #rg de l'anneau est défini plus bas dans ce document. -->
<style>.ring .pr{stroke:url(#rg)}</style>
</head>
<body class="t-obj">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a-hi)"/><stop offset="1" stop-color="var(--a)"/></linearGradient></defs></svg>
<div class="app">
  <header>
    <button class="nav-btn raise" id="prevBtn" data-a="prev" aria-label="Jour précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="date" data-a="today"><b id="dTitle"></b><small id="dSub"></small></button>
    <button class="nav-btn raise" data-a="next" id="nextBtn" aria-label="Jour suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </header>
  <main id="view" class="view"></main>
</div>
<nav class="tabs">
  <button data-a="tab" data-id="obj"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>PATTERN</button>
  <button data-a="tab" data-id="sport"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>PDC</button>
  <button data-a="tab" data-id="chrono"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>MINUTEUR</button>
  <button data-a="tab" data-id="bilan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>BILAN</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<!-- Ordre de chargement important (portée globale partagée) : ne pas changer l'ordre, ajouter tout nouveau fichier dans sw.js -->
<script src="js/config.js"></script>
<script src="js/dates.js"></script>
<script src="js/stockage.js"></script>
<script src="js/sauvegarde.js"></script>
<script src="js/etat.js"></script>
<script src="js/chronos.js"></script>
<script src="js/saisie.js"></script>
<script src="js/vues.js"></script>
<script src="js/bilan.js"></script>
<script src="js/actions.js"></script>
<script src="js/pdf.js"></script>
<script src="js/demarrage.js"></script>
</body>
</html>
