<!doctype html>
<html lang="fr" data-theme="dark" style="color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>PDC Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecf1;--card:#f6f7f9;--card-hi:#ffffff;--well:#e3e7ed;--text:#141821;--muted:#6b7385;--line:rgba(15,23,42,.08);
  --hl:rgba(255,255,255,.95);--sh:rgba(15,23,42,.18);--sh-in:rgba(15,23,42,.16);--track:#dde2e9;
  --ink-g:#15803d;--ink-o:#c2410c;--ink-b:#1d4ed8;--on-a:#0b130e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e12;--card:#161920;--card-hi:#1e222b;--well:#0d0f14;--text:#eef0f4;--muted:#8a93a3;--line:rgba(255,255,255,.06);
  --hl:rgba(255,255,255,.07);--sh:rgba(0,0,0,.6);--sh-in:rgba(0,0,0,.7);--track:#22262f;
  --ink-g:#4ade80;--ink-o:#fb923c;--ink-b:#60a5fa}}
:root[data-theme="dark"]{
  --bg:#0c0e12;--card:#161920;--card-hi:#1e222b;--well:#0d0f14;--text:#eef0f4;--muted:#8a93a3;--line:rgba(255,255,255,.06);
  --hl:rgba(255,255,255,.07);--sh:rgba(0,0,0,.6);--sh-in:rgba(0,0,0,.7);--track:#22262f;
  --ink-g:#4ade80;--ink-o:#fb923c;--ink-b:#60a5fa}
body.t-obj{--a:#4ade80;--a-hi:#b3f5cb;--a-lo:#15803d;--ink:var(--ink-g);--soft:rgba(74,222,128,.13)}
body.t-sport{--a:#fb923c;--a-hi:#fed7aa;--a-lo:#c2410c;--ink:var(--ink-o);--soft:rgba(251,146,60,.14)}
body.t-chrono{--a:#a78bfa;--a-hi:#ddd6fe;--a-lo:#6d28d9;--ink:#c4b5fd;--soft:rgba(167,139,250,.14)}
body.t-chrono header{display:none}
.mnp{display:flex;gap:6px;margin-top:12px}
.mnp button{flex:1;padding:12px 0;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.04em}
.mnp button.on{color:var(--on-a);background:linear-gradient(180deg,var(--a-hi) -60%,var(--a) 60%)}
.mnp button:disabled{opacity:.4;pointer-events:none}
.mview{min-height:calc(100vh - 128px - env(safe-area-inset-bottom));min-height:calc(100dvh - 128px - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top))}
.mcard{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:18px 16px}
.mcard .chrono{flex:0 1 260px;display:flex;align-items:center;justify-content:center;font-size:clamp(56px,17vw,80px);padding:0;margin-bottom:0;min-height:130px}
.mncust{margin-top:14px}.mncust .stp+.stp{margin-top:10px}
.mcard .primary{margin-top:0}.mcard .ghost{margin-top:0}.mcard .mnp{margin-top:0}.mcard .mncust{margin-top:0}
.chrono.fin{animation:fin .3s ease 10 alternate}
@keyframes fin{to{background:var(--a);color:var(--on-a)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;background:var(--a)}
#flash.on{animation:scr 1.1s ease-in-out 3}
@keyframes scr{0%,100%{opacity:0}50%{opacity:.3}}
body.t-bilan{--a:#60a5fa;--a-hi:#bfdbfe;--a-lo:#1d4ed8;--ink:var(--ink-b);--soft:rgba(96,165,250,.14)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:500 15px/1.35 "Barlow","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.05em;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 50% -10%,var(--soft),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;transition:background .3s}
button,input{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom))}

/* Relief */
.card{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 var(--hl),0 1px 2px var(--sh),0 12px 26px -16px var(--sh)}
.pad{padding:16px}
.raise{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl),0 2px 0 var(--sh-in),0 6px 14px -8px var(--sh);transition:transform .08s,box-shadow .08s}
.raise:active{transform:translateY(2px);box-shadow:inset 0 2px 6px var(--sh-in)}
.well{background:var(--well);border:1px solid var(--line);box-shadow:inset 0 2px 6px var(--sh-in),inset 0 -1px 0 var(--hl)}
.primary{display:block;width:100%;margin-top:16px;padding:16px;border-radius:16px;font-weight:700;font-size:16px;letter-spacing:.09em;color:var(--on-a);
  background:linear-gradient(180deg,var(--a-hi) -60%,var(--a) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 var(--a-lo),0 14px 22px -12px var(--a);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 var(--a-lo),0 6px 12px -8px var(--a)}
.ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;font-weight:600;font-size:14px}
.ghost.danger{color:#ef4444}

/* Header */
header{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg) 75%,transparent)}
.nav-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.date{flex:1;text-align:center;padding:4px 0}
.date b{display:block;font-size:18px;font-weight:700;letter-spacing:.08em}
.date small{color:var(--muted);font-size:11px;letter-spacing:.1em}
.view.anim{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.16em;margin:22px 4px 10px}
.muted{color:var(--muted);font-size:12px;letter-spacing:.08em}

/* PATTERN */
.summary{display:flex;align-items:center;gap:18px;padding:18px}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--track)}.ring .pr{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring text{fill:var(--text);font-weight:700;font-size:19px;letter-spacing:.02em;font-family:inherit}
.summary strong{font-size:19px;font-weight:700;letter-spacing:.07em;display:block}
.list{display:flex;flex-direction:column;gap:10px}
.obj{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;text-align:left}
.obj .chk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--well);box-shadow:inset 0 2px 4px var(--sh-in),inset 0 -1px 0 var(--hl);transition:all .18s}
.obj.on{background:linear-gradient(180deg,var(--soft),transparent 140%),linear-gradient(180deg,var(--card-hi),var(--card));border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.obj.on .chk{background:linear-gradient(180deg,var(--a-hi) -60%,var(--a) 60%);color:var(--on-a);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 var(--a-lo),0 4px 10px -4px var(--a)}
.obj .ol{flex:1;font-weight:600;font-size:15px;letter-spacing:.09em}
.obj .st{font-size:11px;color:var(--ink);font-weight:600;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--soft)}
.locked .obj{opacity:.42;filter:grayscale(1);pointer-events:auto}
.locked .obj:active{transform:none;box-shadow:inset 0 1px 0 var(--hl),0 2px 0 var(--sh-in),0 6px 14px -8px var(--sh)}
.lockbar{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 12px 12px 16px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.lockbar svg{flex:none;color:var(--ink)}
.lockbar span{flex:1}
.lockbar button{padding:10px 14px;border-radius:12px;font-weight:700;color:var(--text);font-size:12px;letter-spacing:.1em;flex:none}

/* Sous-onglets / segments */
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;margin-top:4px}
.seg button{flex:1;padding:10px 0;border-radius:12px;font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--muted);transition:color .15s}
.seg button.on{color:var(--on-a);background:linear-gradient(180deg,var(--a-hi) -60%,var(--a) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 var(--a-lo),0 6px 12px -6px var(--a)}

/* Musculation */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.ex.sel{border-color:color-mix(in srgb,var(--a) 55%,transparent);background:linear-gradient(180deg,var(--soft),transparent 150%),linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px color-mix(in srgb,var(--a) 30%,transparent),0 10px 22px -12px var(--a)}
.exn{font-size:13px;font-weight:700;letter-spacing:.1em}
.ex.sel .exn{color:var(--ink)}
.exv{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:auto}
.exs{font-size:11px;color:var(--muted);letter-spacing:.1em}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.ptitle b{font-size:16px;letter-spacing:.1em}
.ptitle span{font-size:12px;color:var(--ink);font-weight:700;letter-spacing:.12em}
.ptitle small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em;margin-right:8px}
.sets{margin-top:18px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.srow .ix{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.srow b{flex:1;font-size:17px;letter-spacing:.06em}
.srow .rec{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink);background:var(--soft);padding:3px 8px;border-radius:999px}
.srow button{width:34px;height:34px;border-radius:11px;color:var(--muted);display:grid;place-items:center}
.empty{color:var(--muted);font-size:12px;padding:10px 4px;border-top:1px solid var(--line);letter-spacing:.08em}

/* Stepper */
.stp+.stp{margin-top:16px}
.stl{font-size:11px;color:var(--muted);letter-spacing:.16em;font-weight:600;margin:0 2px 8px}
.stc{display:flex;align-items:center;gap:10px}
.sbtn{width:56px;height:56px;border-radius:18px;flex:none;display:grid;place-items:center;font-size:28px;font-weight:500;color:var(--text)}
.stw{flex:1;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.stw input{width:100%;min-width:0;background:none;border:0;outline:none;text-align:right;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stw span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.1em;flex:none;min-width:34px}
.stp.big .sbtn{width:72px;height:72px;border-radius:22px;font-size:34px}
.stp.big .stw{height:72px}.stp.big .stw input{font-size:40px}
.stw:focus-within{box-shadow:inset 0 2px 6px var(--sh-in),0 0 0 2px var(--a)}

.chrono{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:22px 0;border-radius:22px;margin-bottom:6px}
.chrono.run{color:var(--ink)}
.hint{text-align:center;margin:12px 0 0}

.rc th:not(:first-child),.rc td:not(:first-child){text-align:right}
.sub{font-size:11px;color:var(--muted);letter-spacing:.14em;font-weight:600;margin:18px 0 6px}

/* Course / poids */
.pace{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:14px 16px;border-radius:14px;font-size:12px;color:var(--muted);letter-spacing:.12em}
.pace b{font-size:20px;color:var(--ink);letter-spacing:.04em}
.status{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.status svg{color:var(--ink);flex:none}.status span{flex:1}
.status button{font-size:11px;font-weight:700;letter-spacing:.1em;color:#ef4444;padding:8px 10px;border-radius:10px}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px 12px 16px;border-radius:16px;width:100%;font-weight:600;font-size:14px;letter-spacing:.1em}
.knob{width:52px;height:30px;border-radius:999px;background:var(--well);box-shadow:inset 0 2px 5px var(--sh-in);position:relative;transition:background .2s;flex:none}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fff,#e5e7eb);box-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .2s}
.switch.on .knob{background:linear-gradient(180deg,var(--a-lo),var(--a))}
.switch.on .knob::after{transform:translateX(22px)}

/* BILAN */
.rlabel{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 4px;letter-spacing:.12em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{padding:14px}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.14em;font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:2px 0}
.kpi small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.chart{width:100%;height:auto;display:block}
.chart .bg{fill:var(--track)}.chart .b{fill:var(--a);opacity:.5}.chart .b.hl{opacity:1}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit;letter-spacing:.04em}
.chart .v{fill:var(--text);font-weight:600}
/* Courbe de poids */
.wchart{touch-action:pan-y;cursor:crosshair}
.wchart .grid{stroke:var(--line);stroke-width:1}
.wchart .ln{fill:none;stroke:var(--a);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wchart .ar{fill:var(--soft)}
.wchart .dot{fill:var(--a);stroke:var(--card-hi);stroke-width:2}
.wchart .tip{opacity:0;transition:opacity .12s;pointer-events:none}
.wchart .tip.show{opacity:1}
.wchart .tip line{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.wchart .tip rect{fill:var(--card-hi);stroke:var(--line)}
.wchart .tip text{fill:var(--text);font-weight:600;font-size:11px}
.wstats{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.wstats b{color:var(--text);font-weight:600}
.rate{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12px}
.rate .n{width:122px;font-weight:600;flex:none;letter-spacing:.07em}
.rate .bar{flex:1;height:10px;border-radius:5px;background:var(--well);box-shadow:inset 0 1px 3px var(--sh-in);overflow:hidden}
.rate .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a-lo),var(--a));border-radius:5px}
.rate .p{width:50px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:9px 0;border-bottom:1px solid var(--line);text-align:right;letter-spacing:.06em}
th{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.14em}
td:first-child,th:first-child{text-align:left;font-weight:600}
tr:last-child td{border-bottom:0}
.banner{border-radius:16px;padding:14px 16px;font-size:12px;margin-top:18px;letter-spacing:.06em;background:var(--soft);border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.banner b{color:var(--ink)}
.banner.warn{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.45)}
.banner.warn b{color:#ef4444}
.safe{display:flex;align-items:center;gap:8px;margin-top:12px}
.safe i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.safe.ok i{background:#22c55e}.safe.ko i{background:#f59e0b}

/* Barre d'onglets flottante */
.tabs{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;max-width:488px;margin:0 auto;border-radius:24px;padding:6px;display:flex;gap:4px;
  background:linear-gradient(180deg,var(--bar-hi),var(--bar));backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--bar-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 34px -10px var(--sh),0 2px 6px var(--sh)}
:root{--bar-hi:rgba(255,255,255,.98);--bar:rgba(255,255,255,.92);--bar-line:rgba(15,23,42,.10);--bar-txt:#4b5263}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar-hi:rgba(60,66,80,.96);--bar:rgba(44,49,60,.94);--bar-line:rgba(255,255,255,.12);--bar-txt:#b4bccb}}
:root[data-theme="dark"]{--bar-hi:rgba(60,66,80,.96);--bar:rgba(44,49,60,.94);--bar-line:rgba(255,255,255,.12);--bar-txt:#b4bccb}
.tabs button{color:var(--bar-txt)!important}.tabs button.on{color:var(--ink)!important;background:var(--soft);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);transition:color .15s,background .15s}
.tabs button.on{color:var(--ink);background:var(--soft);box-shadow:inset 0 1px 3px var(--sh-in)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:12px;font-weight:700;letter-spacing:.1em;opacity:0;pointer-events:none;transition:all .22s;z-index:20;max-width:90%;text-align:center;box-shadow:0 10px 24px -8px var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.rec{white-space:nowrap;background:linear-gradient(180deg,var(--a-hi) -60%,var(--a) 60%);color:var(--on-a);font-size:14px;padding:14px 22px;box-shadow:0 4px 0 var(--a-lo),0 14px 28px -10px var(--a)}
.toast.rec.show{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
</style>
</head>
<body class="t-obj">
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a-hi)"/><stop offset="1" stop-color="var(--a)"/></linearGradient></defs></svg>
<div class="app">
  <header>
    <button class="nav-btn raise" id="prevBtn" data-a="prev" aria-label="Jour précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="date" data-a="today"><b id="dTitle"></b><small id="dSub"></small></button>
    <button class="nav-btn raise" data-a="next" id="nextBtn" aria-label="Jour suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </header>
  <main id="view" class="view"></main>
</div>
<nav class="tabs">
  <button data-a="tab" data-id="obj"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>PATTERN</button>

</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
const OBJ=['SALAT','SPORT','TRAVAIL','APPRENTISSAGE','LECTURE','NO JUNK FOOD','NO THC','NO TABAC','NO PORN'];
const EX=[{id:'tractions',n:'Tractions'},{id:'dips',n:'Dips'},{id:'pompes',n:'Pompes'},{id:'squats',n:'Squats'}];
/* Premier jour de suivi : rien avant cette date n'est affiché ni compté */
const START='2026-11-10',START_D=new Date(START.replace(/-/g,'/'));
const SK='pdc-tracker-v2',SK_PREV=SK+'-avant-import',SK_RESCUE=SK+'-secours-';
const CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const LOCK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const XMARK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

/* ---------- Stockage local (protégé) ---------- */
const isDB=d=>!!d&&typeof d==='object'&&d.days&&typeof d.days==='object'&&!Array.isArray(d.days)&&Object.values(d.days).every(x=>x&&typeof x==='object');
let memCopy=null,saveFailed=false,rescued=false,persisted=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function load(){const s=lsGet(SK);if(!s)return memCopy||{days:{},meta:{}};
  try{const d=JSON.parse(s);if(isDB(d))return{days:d.days,meta:d.meta||{}}}catch(e){}
  /* Données illisibles : on les met de côté au lieu de les écraser */
  lsSet(SK_RESCUE+Date.now(),s);rescued=true;return{days:{},meta:{}}}
function normDB(d){for(const k of Object.keys(d.days)){const x=d.days[k];if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k<START){delete d.days[k];continue}
  if(!x.obj||typeof x.obj!=='object')x.obj={};if(!x.sets||typeof x.sets!=='object')x.sets={};
  for(const e of Object.keys(x.sets))x.sets[e]=Array.isArray(x.sets[e])?x.sets[e].map(Number).filter(v=>v>0):[];
  x.planks=Array.isArray(x.planks)?x.planks.map(Number).filter(v=>v>0):[];
  if(!(x.course&&x.course.d>0))x.course=null;if(!(x.poids&&x.poids.v>0))x.poids=null}return d}
let DB=normDB(load());
function save(){memCopy=DB;const ok=lsSet(SK,JSON.stringify(DB));
  if(!ok&&!saveFailed){saveFailed=true;setTimeout(()=>toast('Attention : enregistrement impossible sur cet appareil. Exportez vos données.',4000),50)}
  if(ok)saveFailed=false}
/* SPORT coché automatiquement dès qu'une série ou une course est saisie (pas le poids).
   Décoché seulement si c'est l'app qui l'avait coché et qu'il ne reste plus rien. */
function syncSport(d){if(!d)return;if(hasSport(d)){if(!d.obj.SPORT){d.obj.SPORT=true;d.sportAuto=true}}else if(d.sportAuto){d.obj.SPORT=false;d.sportAuto=false}}
function getDay(k,create){let d=DB.days[k];if(!d&&create)d=DB.days[k]={obj:{},sets:{},planks:[],poids:null,course:null};return d}
/* Demande au navigateur de ne jamais effacer automatiquement les données */
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persisted();if(!persisted)persisted=await navigator.storage.persist()}}catch(e){}if(tab==='bilan')render()}

/* ---------- Dates & formats ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>new Date(k.replace(/-/g,'/'));
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const fmtLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const num=(n,dec=0)=>n.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtMin=m=>{m=Math.round(m||0);const h=Math.floor(m/60);return h?`${h} h ${pad(m%60)}`:`${m} min`};
const fmtPace=(min,km)=>{if(!(km>0&&min>0))return'–';let p=min/km,m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return`${m}:${pad(s)} /km`};

/* ---------- État ---------- */
let cur=today0()<START_D?new Date(START_D):today0(),tab='obj',pdcSub='muscu',period='week',sel='tractions',stepVal={},armed=0,draftC=null,draftP=null;

/* ---------- Logique ---------- */
const hasSport=d=>!!d&&(Object.values(d.sets||{}).some(a=>a.length)||(d.course&&d.course.d>0)||(d.planks&&d.planks.length>0));
const isDone=(k,id)=>{const d=DB.days[k];return!!(d&&d.obj[id])};
function streak(id,k){let d=fromKey(k);if(!isDone(key(d),id))d=addDays(d,-1);let n=0;while(n<3650&&isDone(key(d),id)){n++;d=addDays(d,-1)}return n}
function findBack(fn){for(let i=0;i<180;i++){const d=DB.days[key(addDays(cur,-i))];const r=d&&fn(d);if(r!=null)return r}return null}
const lastSetValue=ex=>findBack(d=>{const s=d.sets&&d.sets[ex];return s&&s.length?s[s.length-1]:null})??10;
/* Record absolu (meilleure série) d'un exercice, tous jours confondus */
function bestEver(ex){let b=0;for(const d of Object.values(DB.days)){const s=d.sets&&d.sets[ex];if(s)for(const v of s)if(v>b)b=v}return b}
/* ---------- Gainage : chrono, correction avant enregistrement ---------- */
const PK_K=SK+'-chrono';
let pk={st:'idle',t0:0,raw:0,val:30,manual:false},pkTimer=null,wake=null;
try{const s=JSON.parse(lsGet(PK_K)||'null');if(s&&(s.st==='run'||s.st==='done')&&s.t0>0)pk={st:s.st,t0:s.t0,raw:+s.raw||0,val:+s.val>0?+s.val:30,manual:!!s.manual}}catch(e){}
const pkSave=()=>{if(pk.st==='idle')lsDel(PK_K);else lsSet(PK_K,JSON.stringify(pk))};
const fmtDur=s=>{s=Math.max(0,Math.round(s));return`${Math.floor(s/60)}:${pad(s%60)}`};
const pkElapsed=()=>pk.st==='run'?Math.max(0,(Date.now()-pk.t0)/1000):pk.raw;
function pkReset(){clearInterval(pkTimer);pkTimer=null;wakeOff();pk={st:'idle',t0:0,raw:0,val:pk.val||30,manual:false};pkSave()}
function bestPlank(){let b=0;for(const d of Object.values(DB.days))if(d.planks)for(const v of d.planks)if(v>b)b=v;return b}
async function wakeOn(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){}wake=null}
function pkTick(){const el=$('pk-time');if(el)el.textContent=fmtDur(pkElapsed())}
/* ---------- Minuteur de repos : hors bilans ---------- */
const MN_K=SK+'-minuteur',MN_P=[60,90,120,150,180];
let mn={dur:60,st:'idle',end:0,left:60},mnTimer=null,mnFlash=0;
try{const s=JSON.parse(lsGet(MN_K)||'null');if(s&&+s.dur>=5&&+s.dur<=3600)mn={dur:+s.dur,st:s.st==='run'||s.st==='pause'?s.st:'idle',end:+s.end||0,left:+s.left>0?+s.left:+s.dur}}catch(e){}
const mnSave=()=>lsSet(MN_K,JSON.stringify(mn));
const mnRem=()=>mn.st==='run'?Math.max(0,(mn.end-Date.now())/1000):mn.st==='pause'?mn.left:mn.dur;
function mnTick(){if(mn.st==='run'&&mnRem()<=0){mnDone(Date.now()-mn.end>10000);return}const el=$('mn-time');if(el)el.textContent=fmtDur(Math.ceil(mnRem()))}
function mnLoop(){clearInterval(mnTimer);mnTimer=mn.st==='run'?setInterval(mnTick,250):null}
let mnAc=null;
function mnUnlock(){try{mnAc=mnAc||new (window.AudioContext||window.webkitAudioContext)();if(mnAc.resume)mnAc.resume()}catch(e){}}
function mnSound(){try{if(!mnAc)return;const t=mnAc.currentTime,mk=(type,f0,f1,t0,dur,vol)=>{const o=mnAc.createOscillator(),g=mnAc.createGain();o.type=type;o.frequency.setValueAtTime(f0,t+t0);o.frequency.exponentialRampToValueAtTime(f1,t+t0+dur);g.gain.setValueAtTime(0,t+t0);g.gain.linearRampToValueAtTime(vol,t+t0+dur*.25);g.gain.linearRampToValueAtTime(0,t+t0+dur);o.connect(g);g.connect(mnAc.destination);o.start(t+t0);o.stop(t+t0+dur+.02)};
  mk('triangle',350,2400,0,.2,.2);mk('sine',2400,420,.17,.16,.14);mk('sine',3500,1000,.05,.15,.06)}catch(e){}}
let mnFlashT=null;
function mnFlashScreen(){let f=$('flash');if(!f){f=document.createElement('div');f.id='flash';document.body.appendChild(f)}f.className='';void f.offsetWidth;f.className='on';clearTimeout(mnFlashT);mnFlashT=setTimeout(()=>{f.className=''},3400)}
function mnDone(silent){clearInterval(mnTimer);mnTimer=null;wakeOff();mn={dur:mn.dur,st:'idle',end:0,left:mn.dur};mnSave();
  if(!silent){mnFlash=Date.now();mnSound();mnFlashScreen();try{navigator.vibrate&&navigator.vibrate([400,200,400,200,800])}catch(e){}toast('Repos terminé',2500,'rec')}
  if(tab==='chrono')render()}
function mnBoot(){if(mn.st==='run'){if(mnRem()<=0)mnDone(Date.now()-mn.end>10000);else{mnLoop();wakeOn()}}}
let mnEdit=false;
function mnSetDur(x){x=Math.min(5999,Math.max(5,Math.round(x)));mn={dur:x,st:'idle',end:0,left:x};mnSave();const el=$('mn-time');if(el)el.textContent=fmtDur(x)}
function vMinuteur(){const r=mn.st,t=Math.ceil(mnRem()),fl=Date.now()-mnFlash<4000,cust=!MN_P.includes(mn.dur)||mnEdit,dis=r!=='idle'?'disabled':'';
  return `<div class="mview"><div class="card pad mcard"><div class="chrono well ${r==='run'?'run':''} ${fl?'fin':''}" id="mn-time">${fmtDur(t)}</div>
    <div class="mnp">${MN_P.map(x=>`<button class="raise ${!cust&&mn.dur===x?'on':''}" data-a="mnSet" data-s="${x}" ${dis}>${fmtDur(x)}</button>`).join('')}<button class="raise ${cust?'on':''}" data-a="mnCustom" ${dis}>Perso</button></div>
    ${cust&&r==='idle'?`<div class="mncust">${stepper('mnm','min','Minutes')}${stepper('mns','s','Secondes')}</div>`:''}
    <button class="primary" data-a="${r==='run'?'mnPause':'mnStart'}">${r==='run'?'Arrêter':r==='pause'?'Reprendre':'Démarrer'}</button>
    <button class="ghost raise" data-a="mnReset">Réinitialiser</button></div></div>`}
function dC(){const k=key(cur);if(!draftC||draftC.k!==k){const s=(DB.days[k]||{}).course,l=s||findBack(d=>d.course&&d.course.d>0?d.course:null)||{d:5,t:30,den:0};draftC={k,d:l.d,t:l.t,den:l.den||0}}return draftC}
function dP(){const k=key(cur);if(!draftP||draftP.k!==k){const s=(DB.days[k]||{}).poids,l=s||findBack(d=>d.poids&&d.poids.v?d.poids:null)||{v:75,jeun:true};draftP={k,v:l.v,jeun:s?!!s.jeun:true}}return draftP}

/* ---------- Steppers (appui long = défilement rapide) ---------- */
const ST={
  reps:{step:1,min:1,max:500,dec:0,get:()=>stepVal[sel]??lastSetValue(sel),set:v=>stepVal[sel]=v},
  cd:{step:.1,min:0,max:300,dec:1,get:()=>dC().d,set:v=>dC().d=v},
  ct:{step:1,min:0,max:1440,dec:0,get:()=>dC().t,set:v=>dC().t=v},
  cden:{step:10,min:0,max:9000,dec:0,get:()=>dC().den,set:v=>dC().den=v},
  pv:{step:.1,min:20,max:300,dec:1,get:()=>dP().v,set:v=>dP().v=v},
  mnm:{step:1,min:0,max:99,dec:0,get:()=>Math.floor(mn.dur/60),set:v=>mnSetDur(v*60+mn.dur%60)},
  mns:{step:1,min:0,max:59,dec:0,get:()=>mn.dur%60,set:v=>mnSetDur(Math.floor(mn.dur/60)*60+v)},
  pt:{step:5,snap:5,min:1,max:3600,dec:0,get:()=>pk.val,set:v=>pk.val=v}};
const fmtV=(id,v)=>num(v,ST[id].dec);
function stepper(id,unit,label,big){return `<div class="stp ${big?'big':''}">${label?`<div class="stl">${label}</div>`:''}<div class="stc">
  <button class="sbtn raise" data-st="${id}" data-dir="-1" aria-label="Diminuer">−</button>
  <label class="stw well"><input id="in-${id}" data-in="${id}" inputmode="decimal" autocomplete="off" value="${fmtV(id,ST[id].get())}"><span>${unit}</span></label>
  <button class="sbtn raise" data-st="${id}" data-dir="1" aria-label="Augmenter">+</button></div></div>`}
function bump(id,delta){const c=ST[id],f=10**c.dec;let v;
  if(c.snap){v=c.get();for(let i=0;i<Math.abs(delta);i++)v=delta>0?Math.floor(v/c.snap+1e-9)*c.snap+c.snap:Math.ceil(v/c.snap-1e-9)*c.snap-c.snap}
  else v=Math.round((c.get()+delta*c.step)*f)/f;
  v=Math.min(c.max,Math.max(c.min,v));c.set(v);const el=$('in-'+id);if(el)el.value=fmtV(id,v);after(id)}
function after(id){if(id[0]==='c'){const c=dC(),p=$('pace');if(p)p.textContent=fmtPace(c.t,c.d)}
  if(id==='pt'){const h=$('pk-fmt');if(h)h.textContent=fmtDur(pk.val)}}
let rep=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-st]');if(!b)return;e.preventDefault();const id=b.dataset.st,dir=+b.dataset.dir;let n=0;
  const tick=()=>{n++;bump(id,dir*(n>15?5:1))};tick();clearTimeout(rep);rep=setTimeout(function loop(){tick();rep=setTimeout(loop,n>15?70:110)},420)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(rep);rep=null}));
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-st]')){clearTimeout(rep);rep=null}});
document.addEventListener('input',e=>{const id=e.target.dataset.in;if(!id)return;const v=parseFloat(e.target.value.replace(',','.'));const c=ST[id];if(!isNaN(v)){c.set(Math.min(c.max,Math.max(c.min,v)));after(id)}});
document.addEventListener('focusout',e=>{const id=e.target.dataset&&e.target.dataset.in;if(id)e.target.value=fmtV(id,ST[id].get())});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.in)setTimeout(()=>e.target.select(),0)});

/* ---------- Rendu ---------- */
const $=id=>document.getElementById(id);
function renderHeader(){const diff=Math.round((today0()-cur)/864e5);
  $('dTitle').textContent=diff===0?"Aujourd'hui":diff===1?'Hier':fmtLong.format(cur);
  $('dSub').textContent=diff<=1?fmtLong.format(cur):'Revenir à aujourd\'hui';
  $('nextBtn').disabled=diff<=0;$('prevBtn').disabled=+cur<=+START_D;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
  document.body.className='t-'+tab}
function render(anim){renderHeader();const v=$('view');
  v.innerHTML=tab==='obj'?vObj():tab==='sport'?vSport():tab==='chrono'?vMinuteur():vBilan();
  if(anim){v.classList.remove('anim');void v.offsetWidth;v.classList.add('anim')}}

function vObj(){const k=key(cur),d=DB.days[k],locked=!!(d&&d.locked),isToday=+cur===+today0(),done=OBJ.filter(o=>isDone(k,o)).length,r=36,c=2*Math.PI*r;
  const row=o=>{const ok=isDone(k,o),s=streak(o,k);
    return `<button class="obj raise ${ok?'on':''}" data-a="tog" data-id="${o}"><span class="chk">${ok?CHECK:''}</span><span class="ol">${o}</span>${s>1?`<span class="st">${s} J</span>`:''}</button>`};
  const foot=locked?`<div class="lockbar card">${LOCK}<span>${isToday?'Journée validée, verrouillée jusqu\'à demain':'Journée validée'}</span><button class="raise" data-a="unlock">Modifier</button></div>`
    :`<button class="primary" data-a="validate">Valider ma journée · ${done}/${OBJ.length}</button>`;
  return `<div class="card summary" style="margin-top:4px">
    <svg class="ring" width="88" height="88" viewBox="0 0 88 88"><circle class="tr" cx="44" cy="44" r="${r}"/><circle class="pr" cx="44" cy="44" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-done/OBJ.length)}" transform="rotate(-90 44 44)"/><text x="44" y="51" text-anchor="middle">${done}/${OBJ.length}</text></svg>
    <div><strong>${done===OBJ.length?'Journée parfaite':done>=6?'Belle journée':'Objectifs du jour'}</strong><p class="muted">${Math.round(done/OBJ.length*100)} % atteints</p></div></div>
  <div class="${locked?'locked':''}"><h2>À faire</h2><div class="list">${OBJ.slice(0,5).map(row).join('')}</div>
  <h2>À éviter</h2><div class="list">${OBJ.slice(5).map(row).join('')}</div></div>${foot}`}

function vSport(){const seg=`<div class="seg well">${[['muscu','Musculation'],['gain','Gainage'],['course','Course'],['poids','Poids']].map(([k,l])=>`<button class="${pdcSub===k?'on':''}" data-a="sub" data-id="${k}">${l}</button>`).join('')}</div>`;
  return seg+(pdcSub==='muscu'?vMuscu():pdcSub==='gain'?vGainage():pdcSub==='course'?vCourse():vPoids())}
function vMuscu(){const d=DB.days[key(cur)]||{},sets=d.sets||{};
  const tiles=EX.map(e=>{const s=sets[e.id]||[];return `<button class="ex raise ${sel===e.id?'sel':''}" data-a="sel" data-id="${e.id}"><span class="exn">${e.n}</span><span class="exv">${s.length?s.join(' · '):'—'}</span><span class="exs">${s.length} série${s.length>1?'s':''}</span></button>`}).join('');
  const s=sets[sel]||[],ex=EX.find(e=>e.id===sel),best=bestEver(sel),recI=best?s.indexOf(best):-1;
  const rows=s.length?s.map((v,i)=>`<div class="srow"><span class="ix well">${i+1}</span><b>${v} rép.</b>${i===recI?'<span class="rec">Record</span>':''}<button class="raise" data-a="del" data-i="${i}" aria-label="Supprimer la série">${XMARK}</button></div>`).join(''):'<div class="empty">Aucune série validée</div>';
  return `<h2>Exercice</h2><div class="grid">${tiles}</div>
  <h2>Saisie</h2><div class="card pad"><div class="ptitle"><b>${ex.n}</b><span>${best?`<small>Record ${best}</small>`:''}Série ${s.length+1}</span></div>
    ${stepper('reps','rép.','',true)}
    <button class="primary" data-a="add">Valider la série ${s.length+1}</button>
    <div class="sets">${rows}</div></div>`}
function vGainage(){const d=DB.days[key(cur)]||{},pl=d.planks||[],best=bestPlank(),tot=pl.reduce((a,b)=>a+b,0),recI=best?pl.indexOf(best):-1;
  let body;
  if(pk.st==='run')body=`<div class="chrono well run" id="pk-time">${fmtDur(pkElapsed())}</div><button class="primary" data-a="pkStop">Arrêter</button>`;
  else if(pk.st==='done')body=`<div class="chrono well" id="pk-fmt">${fmtDur(pk.val)}</div>
    ${stepper('pt','s','Temps à enregistrer',true)}
    <p class="muted hint">${pk.manual?'Saisie manuelle':'Chrono : '+Math.round(pk.raw)+' s ('+fmtDur(pk.raw)+')'} · correction par pas de 5 s</p>
    <button class="primary" data-a="pkAdd">Valider la série ${pl.length+1}</button>
    <button class="ghost raise danger" data-a="pkCancel">Abandonner</button>`;
  else body=`<div class="chrono well">0:00</div><button class="primary" data-a="pkStart">Démarrer le chrono</button>
    <button class="ghost raise" data-a="pkManual">Saisir manuellement</button>`;
  const rows=pl.length?pl.map((v,i)=>`<div class="srow"><span class="ix well">${i+1}</span><b>${fmtDur(v)}</b>${i===recI?'<span class="rec">Record</span>':''}<button class="raise" data-a="pkDel" data-i="${i}" aria-label="Supprimer la série">${XMARK}</button></div>`).join(''):'<div class="empty">Aucune série validée</div>';
  return `<h2>Gainage</h2><div class="card pad"><div class="ptitle"><b>Chrono</b><span>${best?`<small>Record ${fmtDur(best)}</small>`:''}Série ${pl.length+1}</span></div>
    ${body}<div class="sets">${rows}</div>${pl.length?`<div class="status"><span>Total du jour : ${fmtDur(tot)}</span></div>`:''}</div>`}
function vCourse(){const saved=(DB.days[key(cur)]||{}).course,c=dC();
  return `<h2>Course à pied</h2><div class="card pad">

function vPoids(){const saved=(DB.days[key(cur)]||{}).poids,p=dP();

/* ---------- BILAN ---------- */
function getRange(){const d=cur;let s,e;
  if(period==='day'){s=e=new Date(d)}else if(period==='week'){s=addDays(d,-((d.getDay()+6)%7));e=addDays(s,6)}
  else if(period==='month'){s=new Date(d.getFullYear(),d.getMonth(),1);e=new Date(d.getFullYear(),d.getMonth()+1,0)}
  else{s=new Date(d.getFullYear(),0,1);e=new Date(d.getFullYear(),11,31)}if(s<START_D)s=new Date(START_D);return{s,e}}
function daysBetween(s,e){const a=[];for(let x=new Date(s);x<=e;x=addDays(x,1))a.push(new Date(x));return a}
function stats(days){const t=today0(),el=days.filter(d=>d<=t&&d>=START_D),st={el:el.length,obj:{},done:0,ex:{},run:{d:0,t:0,den:0,n:0},poids:[],plank:{n:0,t:0,best:0}};
  OBJ.forEach(o=>st.obj[o]=0);EX.forEach(e=>st.ex[e.id]={reps:0,sets:0,best:0});
  el.forEach(dt=>{const k=key(dt),d=DB.days[k];OBJ.forEach(o=>{if(isDone(k,o)){st.obj[o]++;st.done++}});if(!d)return;
    EX.forEach(e=>{const s=(d.sets||{})[e.id]||[];st.ex[e.id].reps+=s.reduce((a,b)=>a+b,0);st.ex[e.id].sets+=s.length;st.ex[e.id].best=Math.max(st.ex[e.id].best,...s,0)});
    (d.planks||[]).forEach(v=>{st.plank.n++;st.plank.t+=v;st.plank.best=Math.max(st.plank.best,v)});
    if(d.course&&d.course.d>0){st.run.d+=d.course.d;st.run.t+=d.course.t||0;st.run.den+=d.course.den||0;st.run.n++}
    if(d.poids&&d.poids.v)st.poids.push({k,v:d.poids.v})});
  st.reps=EX.reduce((a,e)=>a+st.ex[e.id].reps,0);st.pct=st.el?st.done/(st.el*OBJ.length):null;return st}
function buckets(s,e){if(period==='year')return MONTHS.map((m,i)=>({l:m[0].toUpperCase(),days:daysBetween(new Date(s.getFullYear(),i,1),new Date(s.getFullYear(),i+1,0)),hl:i===cur.getMonth()}));
  return daysBetween(s,e).map((d,i)=>({l:period==='week'?'DLMMJVS'[d.getDay()]:(d.getDate()%5===0||d.getDate()===1?String(d.getDate()):''),days:[d],hl:+d===+cur}))}
function bars(vals,labels,hl,fmt){const W=320,H=140,pb=18,pt=16,n=vals.length,gap=n>20?2:7,bw=(W-gap*(n-1))/n,ih=H-pb-pt,max=Math.max(1,...vals.map(v=>v||0)),rx=Math.min(5,bw/2);
  let g='';vals.forEach((v,i)=>{const x=i*(bw+gap),h=v?Math.max(2,v/max*ih):0;
    g+=`<rect class="bg" x="${x}" y="${pt}" width="${bw}" height="${ih}" rx="${rx}"/>`;
    if(h)g+=`<rect class="b ${hl[i]?'hl':''}" x="${x}" y="${H-pb-h}" width="${bw}" height="${h}" rx="${rx}"/>`;
    if(n<=12&&v)g+=`<text class="v" x="${x+bw/2}" y="${Math.max(11,H-pb-h-4)}" text-anchor="middle">${fmt(v)}</text>`;
    if(labels[i])g+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`}

/* Courbe de poids : axe X proportionnel aux dates, survol / glissé = valeur exacte */
function wChart(pw,s,e){if(pw.length<2)return`<p class="muted">${pw.length?'Une seule pesée sur la période : il en faut au moins 2 pour tracer la courbe.':'Aucune pesée sur la période.'}</p>`;
  const W=320,H=160,L=36,R=12,T=14,B=22,t0=+s,span=Math.max(864e5,+e-t0);
  const vs=pw.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),m=Math.max(.5,(mx-mn)*.15),lo=Math.floor((mn-m)*2)/2,hi=Math.ceil((mx+m)*2)/2;
  const X=k=>L+(fromKey(k)-t0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const pts=pw.map(p=>[+X(p.k).toFixed(1),+Y(p.v).toFixed(1),p.v,fmtShort.format(fromKey(p.k))]);
  let g='';[lo,(lo+hi)/2,hi].forEach(v=>{const y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${num(v,1)}</text>`});
  g+=`<text x="${L}" y="${H-5}">${fmtShort.format(s)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${fmtShort.format(e)}</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(''),base=H-B;
  g+=`<path class="ar" d="${line}L${pts[pts.length-1][0]} ${base}L${pts[0][0]} ${base}Z"/><path class="ln" d="${line}"/>`;
  if(pts.length<=31)pts.forEach(p=>g+=`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3"/>`);
  const lp=pts[pts.length-1];g+=`<circle class="dot" cx="${lp[0]}" cy="${lp[1]}" r="4.5"/>`;
  g+=`<g class="tip"><line y1="${T}" y2="${base}"/><circle class="dot" r="5"/><rect height="22" rx="6" width="96"/><text text-anchor="middle"></text></g>`;
  return `<svg class="chart wchart" viewBox="0 0 ${W} ${H}" data-pts='${JSON.stringify(pts)}' role="img" aria-label="Évolution du poids">${g}</svg>
  <div class="wstats"><span>Min <b>${num(mn,1)} kg</b></span><span>Moy. <b>${num(vs.reduce((a,b)=>a+b,0)/vs.length,1)} kg</b></span><span>Max <b>${num(mx,1)} kg</b></span></div>`}
function wTip(e){const svg=e.target.closest&&e.target.closest('.wchart');if(!svg)return;const pts=JSON.parse(svg.dataset.pts),r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*320;
  let p=pts[0];for(const q of pts)if(Math.abs(q[0]-x)<Math.abs(p[0]-x))p=q;
  const tip=svg.querySelector('.tip'),ty=p[1]-32<4?p[1]+10:p[1]-32;
  tip.querySelector('line').setAttribute('x1',p[0]);tip.querySelector('line').setAttribute('x2',p[0]);
  const c=tip.querySelector('circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);
  const t=tip.querySelector('text');t.textContent=`${p[3]} · ${num(p[2],1)} kg`;
  const w=Math.ceil(t.getComputedTextLength()*1.08)+18,cx=Math.min(320-12-w/2,Math.max(36+w/2,p[0]));
  t.setAttribute('x',cx);t.setAttribute('y',ty+15);
  const rc=tip.querySelector('rect');rc.setAttribute('width',w);rc.setAttribute('x',cx-w/2);rc.setAttribute('y',ty);
  tip.classList.add('show')}
document.addEventListener('pointermove',wTip);document.addEventListener('pointerdown',wTip);
document.addEventListener('pointerout',e=>{const svg=e.target.closest&&e.target.closest('.wchart');if(svg&&!svg.contains(e.relatedTarget)){const t=svg.querySelector('.tip');t&&t.classList.remove('show')}});

function rangeLabel(s,e){if(period==='day')return fmtLong.format(s);if(period==='week')return`Semaine du ${fmtShort.format(s)} au ${fmtShort.format(e)}`;if(period==='month')return MONTHS[s.getMonth()]+' '+s.getFullYear();return'Année '+s.getFullYear()}
function recapRows(s,e){if(period==='day')return[];const out=[],DJ=['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
  if(period==='week')daysBetween(s,e).forEach(x=>out.push({l:DJ[x.getDay()]+' '+x.getDate(),days:[x]}));
  else if(period==='month'){let a=new Date(s);while(a<=e){let b=addDays(a,6-((a.getDay()+6)%7));if(b>e)b=new Date(e);
    out.push({l:+a===+b?fmtShort.format(a):a.getDate()+'–'+fmtShort.format(b),days:daysBetween(a,b)});a=addDays(b,1)}}
  else MONTHS.forEach((m,i)=>out.push({l:m,days:daysBetween(new Date(s.getFullYear(),i,1),new Date(s.getFullYear(),i+1,0))}));
  return out.map(r=>({l:r.l,st:stats(r.days)})).filter(r=>r.st.el>0)}
const recapUnit=()=>({week:'jour',month:'semaine',year:'mois'}[period]||'');
const rcRun=r=>[r.l,r.st.run.n?num(r.st.run.d,1)+' km':'–',r.st.run.t?fmtMin(r.st.run.t):'–'];
const rcPlank=r=>[r.l,r.st.plank.n?r.st.plank.n+' × · '+fmtDur(r.st.plank.t):'–',r.st.plank.best?fmtDur(r.st.plank.best):'–'];
function recapTable(rows,heads,fn){if(!rows.length)return'';return`<div class="sub">Par ${recapUnit()}</div><table class="rc"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${fn(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`}
function vBilan(){const{s,e}=getRange(),st=stats(daysBetween(s,e)),P={day:'Jour',week:'Semaine',month:'Mois',year:'Année'};
  const last=DB.meta.lastExport,due=last?(Date.now()-last)>7*864e5:(today0()-START_D)>=7*864e5,pw=st.poids,pDelta=pw.length>1?pw[pw.length-1].v-pw[0].v:null,hasPrev=!!lsGet(SK_PREV),rr=recapRows(s,e),byObj=`<div class="sub">Par objectif</div>${OBJ.map(o=>{const p=st.el?Math.round(st.obj[o]/st.el*100):0;return`<div class="rate"><span class="n">${o}</span><span class="bar"><i style="width:${p}%"></i></span><span class="p">${p} %</span></div>`}).join('')}`;
  let charts;
  if(period!=='day'){const bk=buckets(s,e),bs=bk.map(b=>stats(b.days)),hl=bk.map(b=>b.hl),lb=bk.map(b=>b.l);
    charts=`<h2>Objectifs atteints par ${period==='year'?'mois':'jour'}</h2><div class="card pad">${bars(bs.map(x=>x.pct==null?0:Math.round(x.pct*100)),lb,hl,v=>v+'%')}${byObj}</div>
    <h2>Répétitions</h2><div class="card pad">${bars(bs.map(x=>x.reps),lb,hl,v=>v>=1000?(v/1000).toFixed(1)+'k':v)}</div>
    <h2>Poids</h2><div class="card pad">${wChart(pw,s,e)}</div>`}
  else charts=`<h2>Objectifs du jour</h2><div class="card pad">${byObj.replace('<div class="sub">Par objectif</div>','')}</div><h2>Répétitions du jour</h2><div class="card pad">${bars(EX.map(x=>st.ex[x.id].reps),EX.map(x=>x.n.toUpperCase()),EX.map(()=>1),v=>v)}</div>`;
  const safe=persisted===true?`<p class="muted safe ok"><i></i>Stockage protégé : le navigateur ne l'effacera pas</p>`
    :persisted===false?`<p class="muted safe ko"><i></i>Stockage non garanti : installez l'app sur l'écran d'accueil et exportez chaque semaine</p>`:'';
  return `<div class="seg well">${Object.entries(P).map(([k,l])=>`<button class="${period===k?'on':''}" data-a="per" data-id="${k}">${l}</button>`).join('')}</div>
  <div class="rlabel">${rangeLabel(s,e)}</div>
  <div class="kpis">
    <div class="kpi card"><span>Objectifs</span><b>${st.pct==null?'–':Math.round(st.pct*100)+' %'}</b><small>${st.done} cochés</small></div>
    <div class="kpi card"><span>Répétitions</span><b>${num(st.reps)}</b><small>${EX.reduce((a,x)=>a+st.ex[x.id].sets,0)} séries</small></div>
    <div class="kpi card"><span>Course</span><b>${num(st.run.d,1)} km</b><small>${st.run.n} sortie${st.run.n>1?'s':''} · ${num(st.run.den)} m D+</small></div>
    <div class="kpi card"><span>Poids</span><b>${pw.length?num(pw[pw.length-1].v,1)+' kg':'–'}</b><small>${pDelta==null?'dernière pesée':(pDelta>0?'+':'')+num(pDelta,1)+' kg sur la période'}</small></div>
  </div>
  ${charts}
  <h2>Musculation</h2><div class="card pad"><table><tr><th>Exercice</th><th>Total</th><th>Séries</th><th>Record</th></tr>${EX.map(x=>`<tr><td>${x.n}</td><td>${num(st.ex[x.id].reps)}</td><td>${st.ex[x.id].sets}</td><td>${st.ex[x.id].best||'–'}</td></tr>`).join('')}</table></div>
  <h2>Course</h2><div class="card pad"><table><tr><td>Distance</td><td>${num(st.run.d,1)} km</td></tr><tr><td>Temps</td><td>${st.run.t?fmtMin(st.run.t):'–'}</td></tr><tr><td>Dénivelé +</td><td>${num(st.run.den)} m</td></tr><tr><td>Allure moyenne</td><td>${fmtPace(st.run.t,st.run.d)}</td></tr></table>${recapTable(rr,['Période','Distance','Temps'],rcRun)}</div>
  <h2>Gainage</h2><div class="card pad"><table><tr><td>Séries</td><td>${st.plank.n}</td></tr><tr><td>Temps total</td><td>${st.plank.t?fmtDur(st.plank.t):'–'}</td></tr><tr><td>Meilleure série</td><td>${st.plank.best?fmtDur(st.plank.best):'–'}</td></tr></table>${recapTable(rr,['Période','Séries · total','Meilleure'],rcPlank)}</div>
  ${rescued?`<div class="banner warn"><b>Données illisibles détectées.</b> Elles ont été mises de côté sur cet appareil sans être effacées. Importez votre dernière sauvegarde.</div>`:''}
  ${saveFailed?`<div class="banner warn"><b>Enregistrement impossible.</b> Le navigateur refuse le stockage (navigation privée ?). Exportez avant de fermer.</div>`:''}
  ${due?`<div class="banner"><b>Bilan hebdo à exporter.</b> Un appui crée le PDF et la sauvegarde, puis ouvre le partage (Mail, Fichiers…).</div>`:''}
  <h2>Export et données</h2><div class="card pad">
    <button class="primary" style="margin-top:0" data-a="export">Exporter ce bilan</button>
    <button class="ghost raise" data-a="import">Importer une sauvegarde</button>
    ${hasPrev?`<button class="ghost raise" data-a="undoImport">Annuler le dernier import</button>`:''}
    <button class="ghost raise danger" data-a="clear">Tout effacer</button>
    <p class="muted" style="margin-top:12px">${last?'Dernier export : '+fmtShort.format(new Date(last)):'Aucun export pour l\'instant'} · données stockées sur cet appareil</p>${safe}</div>`}

function toast(m,ms,cls){const t=$('toast');t.className='toast'+(cls?' '+cls:'');t.textContent=m;void t.offsetWidth;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms||1800)}
function confirmArm(name,msg){if(armed===name){armed=0;return true}armed=name;toast(msg||'Touchez à nouveau pour confirmer');setTimeout(()=>{if(armed===name)armed=0},3000);return false}
const hasData=()=>Object.keys(DB.days).length>0;
const actions={
  prev(){if(cur>START_D){cur=addDays(cur,-1);render()}},
  next(){if(cur<today0()){cur=addDays(cur,1);render()}},

  validate(){if(!confirmArm('validate','Touchez à nouveau pour valider'))return;getDay(key(cur),true).locked=true;save();render();toast('Journée validée')},
  unlock(){getDay(key(cur),true).locked=false;save();render()},
  sel(b){sel=b.dataset.id;render()},
  add(){const v=ST.reps.get(),prevBest=bestEver(sel),d=getDay(key(cur),true),ex=EX.find(e=>e.id===sel);(d.sets[sel]=d.sets[sel]||[]).push(v);stepVal[sel]=v;syncSport(d);save();render();
    if(prevBest>0&&v>prevBest){toast(`Nouveau record : ${v} rép. (+${v-prevBest})`,3200,'rec');try{navigator.vibrate&&navigator.vibrate([60,50,140])}catch(e){}}
    else toast(`Série de ${v} validée`)},

  delP(){const d=getDay(key(cur));if(d)d.poids=null;draftP=null;save();render()},
  mnCustom(){if(mn.st!=='idle')return;mnEdit=true;render()},

  mnStart(){mnUnlock();const rem=mn.st==='pause'?mn.left:mn.dur;mn={dur:mn.dur,st:'run',end:Date.now()+rem*1000,left:rem};mnSave();mnLoop();wakeOn();render()},

  pkManual(){const d=DB.days[key(cur)],last=d&&d.planks&&d.planks.length?d.planks[d.planks.length-1]:30;pk={st:'done',t0:Date.now(),raw:0,val:last,manual:true};pkSave();render()},
  pkAdd(){const v=pk.val,prev=bestPlank(),d=getDay(key(cur),true);(d.planks=d.planks||[]).push(v);syncSport(d);pkReset();pk.val=v;save();render();
    if(prev>0&&v>prev){toast(`Nouveau record : ${fmtDur(v)} (+${v-prev} s)`,3200,'rec');try{navigator.vibrate&&navigator.vibrate([60,50,140])}catch(e){}}
    else toast(`Série de ${fmtDur(v)} validée`)},

};

/* ---------- Export PDF + sauvegarde ---------- */
/* Générateur PDF intégré : aucune bibliothèque externe, fonctionne hors ligne. */
const HWID=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const CP1252={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159,' ':32,' ':32,'−':45};
const PC={ink:[.08,.09,.13],mut:[.42,.45,.52],acc:[.114,.306,.847],line:[.84,.86,.9],track:[.9,.92,.95]};
const pdfEnc=s=>{let o='';for(const ch of String(s).replace(/[\r\n\t]/g,' ')){const c=ch.codePointAt(0);o+=String.fromCharCode(c<256?c:(CP1252[ch]||63))}return o};
const pdfEsc=s=>pdfEnc(s).replace(/[\\()]/g,'\\$&');
const strW=(s,size,bold)=>{let w=0;for(const ch of String(s).normalize('NFD')){const c=ch.charCodeAt(0);if(c>=0x300&&c<=0x36f)continue;w+=(c>=32&&c<=126?HWID[c-32]:556)}return w*size/1000*(bold?1.06:1)};
function newPDF(){const W=595,H=842,M=44,pages=[],f=n=>(+n).toFixed(2),col=c=>c.join(' ');let ops,y;
  const page=()=>{ops=[];pages.push(ops);y=H-M};page();
  return{W,M,
    get y(){return y},
    gap(h){y-=h},
    need(h){if(y-h<M)page()},
    text(x,s,size=10,o={}){const w=o.right||o.center?strW(s,size,o.bold):0,px=o.right?x-w:o.center?x-w/2:x;
      ops.push(`BT /${o.bold?'F2':'F1'} ${size} Tf ${col(o.color||PC.ink)} rg ${f(px)} ${f(o.y??y)} Td (${pdfEsc(s)}) Tj ET`)},
    rect(x,ry,w,h,c){ops.push(`${col(c)} rg ${f(x)} ${f(ry)} ${f(w)} ${f(h)} re f`)},
    line(x1,y1,x2,y2,c=PC.line,w=.6){ops.push(`${col(c)} RG ${w} w ${f(x1)} ${f(y1)} m ${f(x2)} ${f(y2)} l S`)},
    poly(pts,c,w=1.4){ops.push(`${col(c)} RG ${w} w 1 j 1 J `+pts.map((p,i)=>`${f(p[0])} ${f(p[1])} ${i?'l':'m'}`).join(' ')+' S')},
    dot(x,yy,r=2,c=PC.acc){const k=.5523*r;ops.push(`${col(c)} rg ${f(x+r)} ${f(yy)} m ${f(x+r)} ${f(yy+k)} ${f(x+k)} ${f(yy+r)} ${f(x)} ${f(yy+r)} c ${f(x-k)} ${f(yy+r)} ${f(x-r)} ${f(yy+k)} ${f(x-r)} ${f(yy)} c ${f(x-r)} ${f(yy-k)} ${f(x-k)} ${f(yy-r)} ${f(x)} ${f(yy-r)} c ${f(x+k)} ${f(yy-r)} ${f(x+r)} ${f(yy-k)} ${f(x+r)} ${f(yy)} c f`)},
    build(){const n=pages.length,objs=[],kids=pages.map((_,i)=>`${5+2*i} 0 R`).join(' ');
      objs.push('<< /Type /Catalog /Pages 2 0 R >>',`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`,
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      pages.forEach((p,i)=>{const t=`PDC Tracker - page ${i+1}/${n}`,foot=`BT /F1 8 Tf ${col(PC.mut)} rg ${f(W/2-strW(t,8)/2)} 24 Td (${pdfEsc(t)}) Tj ET`,
        stream=p.concat(foot).join('\n');
        objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+2*i} 0 R >>`,
          `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`)});
      objs.push('<< /Title (PDC Tracker - Bilan) /Producer (PDC Tracker) >>');
      let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];
      objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
      const xr=out.length;
      out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')
        +`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info ${objs.length} 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
      return new Blob([u],{type:'application/pdf'})}}}
function pdfBars(d,vals,labels,h,max){d.need(h+34);const L=d.M,w=d.W-2*d.M,n=vals.length,g=n>20?2:5,bw=(w-g*(n-1))/n,mx=max||Math.max(1,...vals),base=d.y-h;
  vals.forEach((v,i)=>{const x=L+i*(bw+g);d.rect(x,base,bw,h,PC.track);if(v>0)d.rect(x,base,bw,Math.max(1.5,Math.min(1,v/mx)*h),PC.acc);
    if(labels[i])d.text(x+bw/2,labels[i],7,{y:base-10,center:true,color:PC.mut})});d.gap(h+26)}
function pdfRecap(d,rr,heads,fn){if(!rr.length)return;const L=d.M,R=d.W-d.M;d.need(40);d.gap(4);d.text(L,'Par '+recapUnit(),8,{bold:true,color:PC.mut});d.gap(13);
  d.text(L,heads[0],8,{bold:true,color:PC.mut});d.text(L+260,heads[1],8,{bold:true,color:PC.mut,right:true});d.text(R,heads[2],8,{bold:true,color:PC.mut,right:true});d.gap(6);d.line(L,d.y,R,d.y);d.gap(13);
  rr.forEach(r=>{const c=fn(r);d.need(15);d.text(L,c[0],9);d.text(L+260,c[1],9,{right:true});d.text(R,c[2],9,{right:true});d.gap(14)})}
function buildPDF(){const{s,e}=getRange(),st=stats(daysBetween(s,e)),d=newPDF(),L=d.M,R=d.W-d.M,pw=st.poids,
    pDelta=pw.length>1?pw[pw.length-1].v-pw[0].v:null,sets=EX.reduce((a,x)=>a+st.ex[x.id].sets,0);
  const sec=t=>{d.need(70);d.gap(10);d.text(L,t,12,{bold:true,color:PC.acc});d.gap(6);d.line(L,d.y,R,d.y);d.gap(16)};
  d.gap(14);d.text(L,'PDC Tracker',22,{bold:true,color:PC.acc});d.gap(20);
  d.text(L,rangeLabel(s,e),12,{bold:true});d.gap(14);
  d.text(L,'Généré le '+new Intl.DateTimeFormat('fr-FR',{dateStyle:'long'}).format(new Date()),9,{color:PC.mut});d.gap(14);
  /* Chiffres clés */
  const kw=(R-L)/4,kp=[['Objectifs',st.pct==null?'–':Math.round(st.pct*100)+' %',st.done+' cochés'],
    ['Répétitions',num(st.reps),sets+' série'+(sets>1?'s':'')],
    ['Course',num(st.run.d,1)+' km',st.run.n+' sortie'+(st.run.n>1?'s':'')],
    ['Poids',pw.length?num(pw[pw.length-1].v,1)+' kg':'–',pDelta==null?'dernière pesée':(pDelta>0?'+':'')+num(pDelta,1)+' kg sur la période']];
  d.need(60);const y0=d.y;
  kp.forEach((c,i)=>{const x=L+i*kw;d.text(x,c[0],8,{y:y0,bold:true,color:PC.mut});d.text(x,c[1],16,{y:y0-18,bold:true});d.text(x,c[2],8,{y:y0-31,color:PC.mut})});
  d.gap(42);
  /* Objectifs */
  sec('Objectifs du pattern');
  const bx=L+135,bw=R-bx-95;
  OBJ.forEach(o=>{d.need(18);const p=st.el?st.obj[o]/st.el:0;
    d.text(L,o,10);d.rect(bx,d.y-1,bw,7,PC.track);if(p>0)d.rect(bx,d.y-1,bw*p,7,PC.acc);
    d.text(R,Math.round(p*100)+' %',10,{right:true,bold:true});d.text(R-38,st.obj[o]+'/'+st.el,9,{right:true,color:PC.mut});d.gap(17)});
  if(period!=='day'){const bk=buckets(s,e),bs=bk.map(b=>stats(b.days));
    sec('Objectifs atteints par '+(period==='year'?'mois':'jour'));
    pdfBars(d,bs.map(x=>x.pct==null?0:Math.round(x.pct*100)),bk.map(b=>b.l),80,100)}
  /* Musculation */
  sec('Musculation');
  const cx=[L,L+250,L+340,R];
  d.text(cx[0],'Exercice',8,{bold:true,color:PC.mut});d.text(cx[1],'Total',8,{bold:true,color:PC.mut,right:true});
  d.text(cx[2],'Séries',8,{bold:true,color:PC.mut,right:true});d.text(cx[3],'Record',8,{bold:true,color:PC.mut,right:true});d.gap(6);d.line(L,d.y,R,d.y);d.gap(14);
  EX.forEach(x=>{d.need(20);const r=st.ex[x.id];d.text(cx[0],x.n,10,{bold:true});d.text(cx[1],num(r.reps),10,{right:true});
    d.text(cx[2],String(r.sets),10,{right:true});d.text(cx[3],r.best?r.best+' rép.':'–',10,{right:true});d.gap(6);d.line(L,d.y,R,d.y);d.gap(14)});
  /* Course */
  sec('Course à pied');
  [['Sorties',String(st.run.n)],['Distance',num(st.run.d,1)+' km'],['Temps',st.run.t?fmtMin(st.run.t):'–'],['Dénivelé +',num(st.run.den)+' m'],['Allure moyenne',fmtPace(st.run.t,st.run.d)]]
    .forEach(r=>{d.need(18);d.text(L,r[0],10,{color:PC.mut});d.text(L+130,r[1],10,{bold:true});d.gap(16)});
  pdfRecap(d,recapRows(s,e),['P\u00e9riode','Distance','Temps'],rcRun);
  /* Gainage */
  sec('Gainage');
  [['Séries',String(st.plank.n)],['Temps total',st.plank.t?fmtDur(st.plank.t):'–'],['Meilleure série',st.plank.best?fmtDur(st.plank.best):'–']]
    .forEach(r=>{d.need(18);d.text(L,r[0],10,{color:PC.mut});d.text(L+130,r[1],10,{bold:true});d.gap(16)});
  pdfRecap(d,recapRows(s,e),['P\u00e9riode','S\u00e9ries \u00b7 total','Meilleure'],rcPlank);
  /* Poids */
  d.need(pw.length<2?90:210);sec('Poids');
  if(pw.length<2){d.text(L,pw.length?'Une seule pesée sur la période : '+num(pw[0].v,1)+' kg':'Aucune pesée sur la période',10,{color:PC.mut});d.gap(18)}
  else{const H=120;d.need(H+60);
    const vs=pw.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),m=Math.max(.5,(mx-mn)*.15),lo=Math.floor((mn-m)*2)/2,hi=Math.ceil((mx+m)*2)/2,
      x0=L+34,x1=R-6,bot=d.y-H,t0=+s,span=Math.max(864e5,+e-t0),X=k=>x0+(fromKey(k)-t0)/span*(x1-x0),Y=v=>bot+(v-lo)/(hi-lo)*H;
    [lo,(lo+hi)/2,hi].forEach(v=>{d.line(x0,Y(v),x1,Y(v));d.text(x0-5,num(v,1),8,{y:Y(v)-3,right:true,color:PC.mut})});
    d.poly(pw.map(p=>[X(p.k),Y(p.v)]),PC.acc);
    if(pw.length<=40)pw.forEach(p=>d.dot(X(p.k),Y(p.v)));
    d.text(x0,fmtShort.format(s),8,{y:bot-12,color:PC.mut});d.text(x1,fmtShort.format(e),8,{y:bot-12,right:true,color:PC.mut});
    d.gap(H+32);
    const sc=[['Première',pw[0].v],['Dernière',pw[pw.length-1].v],['Minimum',mn],['Moyenne',vs.reduce((a,b)=>a+b,0)/vs.length],['Maximum',mx]],cw=(R-L)/5;
    d.need(30);const yy=d.y;sc.forEach((c,i)=>{d.text(L+i*cw,c[0],8,{y:yy,bold:true,color:PC.mut});d.text(L+i*cw,num(c[1],1)+' kg',11,{y:yy-14,bold:true})});d.gap(24)}
  return d.build()}
async function doExport(){const{s,e}=getRange(),label=rangeLabel(s,e),files=[],stamp=key(today0()),pn={day:'jour',week:'semaine',month:'mois',year:'annee'}[period];
  files.push(new File([JSON.stringify(DB)],`PDC-sauvegarde-${stamp}.json`,{type:'application/json'}));
  try{files.unshift(new File([buildPDF()],`PDC-bilan-${pn}-${stamp}.pdf`,{type:'application/pdf'}))}catch(err){toast('PDF impossible : sauvegarde seule',2600)}
  try{if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files,title:'PDC Tracker - '+label});
    else files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
    DB.meta.lastExport=Date.now();save();render();toast('Export prêt')}catch(err){if(err&&err.name!=='AbortError')toast('Export impossible ici')}}
